# Debian 13 "trixie" unattended install for the VirtualMinecraft default OS (ROADMAP §6f).
# build.sh substitutes the @TOKENS@ and serves this from a throwaway http.server on the host;
# the installer reaches it at 10.0.2.2 through QEMU user networking. Nothing here needs root on the host.
#
# What this file owns: partitioning, locale, users, the base system and the bootloader.
# Everything else (desktop, tuning, bus tooling) is phase 2, over the serial console.

### Localisation ------------------------------------------------------------
d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us
d-i console-setup/ask_detect boolean false

### Network -----------------------------------------------------------------
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string @HOSTNAME@
d-i netcfg/get_domain string
d-i netcfg/hostname string @HOSTNAME@
d-i netcfg/wireless_wep string
d-i hw-detect/load_firmware boolean false

### Mirror ------------------------------------------------------------------
d-i mirror/country string manual
d-i mirror/http/hostname string @MIRROR_HOST@
d-i mirror/http/directory string @MIRROR_DIR@
d-i mirror/http/proxy string
d-i mirror/suite string @SUITE@

### Clock -------------------------------------------------------------------
# The mod runs QEMU with -rtc base=localtime, so the guest must read the RTC as local
# time and carry the host's zone; otherwise the desktop clock is wrong by the UTC offset.
d-i clock-setup/utc boolean false
d-i time/zone string @TIMEZONE@
d-i clock-setup/ntp boolean false

### Partitioning ------------------------------------------------------------
# One ESP + one ext4 root, no swap. Swap would be sized from the *build* RAM (4 GB), which is
# wasted space in an image that ships at 1-2 GB of guest RAM; suspend writes RAM to the qcow2 anyway.
d-i partman-auto/disk string /dev/sda
d-i partman-auto/method string regular
d-i partman-auto/expert_recipe string                         \
      vmcos ::                                                \
              538 538 1075 free                               \
                      $iflabel{ gpt }                         \
                      $reusemethod{ }                         \
                      method{ efi } format{ }                 \
              .                                               \
              1024 10000 -1 ext4                              \
                      method{ format } format{ }              \
                      use_filesystem{ } filesystem{ ext4 }    \
                      mountpoint{ / }                         \
              .
d-i partman-auto/choose_recipe select vmcos
d-i partman-basicfilesystems/no_swap boolean false
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true
d-i partman-efi/non_efi_system boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-lvm/device_remove_lvm boolean true

### Accounts ----------------------------------------------------------------
# Both passwords are @PASSWORD@ and that is deliberate: this is a toy machine with no network
# services, and a player who breaks their desktop session must still be able to log in on tty2.
# Plasma refuses to run as root, so the desktop user is @USERNAME@ with passwordless sudo.
d-i passwd/root-login boolean true
d-i passwd/root-password password @PASSWORD@
d-i passwd/root-password-again password @PASSWORD@
d-i passwd/make-user boolean true
d-i passwd/user-fullname string VirtualMinecraft
d-i passwd/username string @USERNAME@
d-i passwd/user-password password @PASSWORD@
d-i passwd/user-password-again password @PASSWORD@
d-i user-setup/allow-password-empty boolean false
d-i user-setup/encrypt-home boolean false

### Packages ----------------------------------------------------------------
d-i apt-setup/non-free-firmware boolean true
d-i apt-setup/contrib boolean true
d-i apt-setup/services-select multiselect security, updates
d-i apt-setup/cdrom/set-first boolean false
popularity-contest popularity-contest/participate boolean false
tasksel tasksel/first multiselect standard
d-i pkgsel/include string sudo python3 ca-certificates
d-i pkgsel/upgrade select none

### Bootloader --------------------------------------------------------------
# force-efi-extra-removable is not optional here: the mod boots OVMF from a read-only -bios image,
# so there is no persistent EFI variable store and only \EFI\BOOT\BOOTX64.EFI is ever tried.
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean true
d-i grub-installer/bootdev string /dev/sda
d-i grub-installer/force-efi-extra-removable boolean true
d-i debian-installer/add-kernel-opts string console=tty0 console=ttyS0,115200 video=@VIDEO@

### Finish ------------------------------------------------------------------
d-i finish-install/reboot_in_progress note
d-i preseed/late_command string in-target sh -c 'echo "@USERNAME@ ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/@USERNAME@; chmod 440 /etc/sudoers.d/@USERNAME@'; echo VMC_PRESEED_DONE > /dev/console
