# The 1.20.1 backport's build. The mod's version comes from ../gradle.properties (see build.gradle), so the two
# builds can never drift apart; everything here is what differs for 1.20.1.
org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true
org.gradle.configuration-cache=false

# Fabric Properties (https://fabricmc.net/develop, 1.20.1 column)
minecraft_version=1.20.1
loader_version=0.19.3
loom_version=1.17-SNAPSHOT

group=dev.virtualminecraft

# Dependencies
fabric_api_version=0.92.11+1.20.1
chicory_version=1.7.5
cobalt_version=0.9.9

org.gradle.java.home=/usr/lib/jvm/java-25-openjdk

