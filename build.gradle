plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

repositories {
	// Loom adds the Minecraft/Fabric repositories automatically.
	exclusiveContent {
		forRepository {
			maven {
				name = "Modrinth"
				url = "https://api.modrinth.com/maven"
			}
		}
		filter {
			includeGroup "maven.modrinth"
		}
	}
	exclusiveContent {
		forRepository {
			maven {
				name = "SquidDev"   // Cobalt, bench-only (the S0 speed reference)
				url = "https://maven.squiddev.cc"
			}
		}
		filter {
			includeGroup "cc.tweaked"
		}
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"virtualminecraft" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Milestone 7: the Computer's Lua runtime is Cobalt (CC: Tweaked's Lua, MPL-2.0), shaded into the jar.
	// Chosen by the S0 spike (PERFORMANCE.md "The Computer's runtime"): Lua-as-WebAssembly in Chicory was
	// 15-34x slower. The spike stays runnable as the bench below; Chicory is a test-only dependency.
	implementation "cc.tweaked:cobalt:${project.cobalt_version}"
	include "cc.tweaked:cobalt:${project.cobalt_version}"
	["runtime", "compiler", "wasm"].each { a ->
		testImplementation "com.dylibso.chicory:${a}:${project.chicory_version}"
	}
}

// The test source set holds JavaExec harnesses (below), not JUnit tests.
tasks.named("test") {
	failOnNoDiscoveredTests = false
}

// S1 harness: the Cobalt machine core outside Minecraft (ROADMAP §7h §10, S1).
tasks.register("luaMachineTest", JavaExec) {
	group = "verification"
	description = "Run LuaMachineTest: kernel protocol, sandbox, preemption, memory meter"
	classpath = sourceSets.test.runtimeClasspath
	mainClass = "dev.virtualminecraft.computer.LuaMachineTest"
	jvmArgs "-Xmx2G"
}

tasks.register("schedulerTest", JavaExec) {
	group = "verification"
	description = "Run SchedulerTest: worker pool fairness, wake on event, CPU share, allocation monitor"
	classpath = sourceSets.test.runtimeClasspath
	mainClass = "dev.virtualminecraft.computer.SchedulerTest"
	jvmArgs "-Xmx2G"
}

tasks.register("screenDeviceTest", JavaExec) {
	group = "verification"
	description = "Run ScreenDeviceTest: the Computer's indexed framebuffer outside Minecraft"
	classpath = sourceSets.test.runtimeClasspath
	mainClass = "dev.virtualminecraft.computer.ScreenDeviceTest"
}

tasks.register("machineFilesTest", JavaExec) {
	group = "verification"
	description = "Run MachineFilesTest: the Computer's storage layer outside Minecraft"
	classpath = sourceSets.test.runtimeClasspath
	mainClass = "dev.virtualminecraft.computer.MachineFilesTest"
}

tasks.register("chassisVoiceTest", JavaExec) {
	group = "verification"
	description = "The hardware voice (U5): POST, relay, drive clicks, the fan, silence, and the two-chip mix"
	classpath = sourceSets.test.runtimeClasspath
	mainClass = "dev.virtualminecraft.computer.ChassisVoiceTest"
}

tasks.register("soundChipTest", JavaExec) {
	group = "verification"
	description = "The Computer's sound chip outside Minecraft: waveforms, envelope, samples, silence, cost"
	classpath = sourceSets.test.runtimeClasspath
	mainClass = "dev.virtualminecraft.computer.SoundChipTest"
}

// The interactive emulator ([name]'s suggestion, session 10): the ROM in a Swing window over the harness's pretend bus,
// files under run/emulator/. `./gradlew computerEmulator --args="--size 256x256 --scale 3"`; --help lists the options.
tasks.register("computerEmulator", JavaExec) {
	group = "application"
	description = "Run the Computer's ROM in a desktop window outside Minecraft (pretend bus, persistent /disk under run/emulator)"
	classpath = sourceSets.test.runtimeClasspath
	mainClass = "dev.virtualminecraft.computer.ComputerEmulator"
	workingDir = project.projectDir
}

// Block shapes, outside Minecraft (session 18). The bus cable had no usable hitbox for two milestones because
// PipeBlock's constructor takes PIXELS and we passed a fraction; nothing else in the project looks at shapes.
tasks.register("blockShapeTest", JavaExec) {
	group = "verification"
	description = "Run BlockShapeTest: block collision shapes and their units, no Minecraft needed"
	classpath = sourceSets.test.runtimeClasspath
	mainClass = "dev.virtualminecraft.block.BlockShapeTest"
}

tasks.register("romBootTest", JavaExec) {
	group = "verification"
	description = "Run RomBootTest: boots the ROM kernel outside Minecraft and drives it with events"
	classpath = sourceSets.test.runtimeClasspath
	mainClass = "dev.virtualminecraft.computer.RomBootTest"
}

// S0 harness (ROADMAP §7h §10, S0): the Lua-as-wasm spike vs Cobalt, outside Minecraft. Needs run/toolchain/lua.wasm
// from tools/lua-wasm/build.sh. Kept as the record of why the runtime is Cobalt.
tasks.register("machineBench", JavaExec) {
	group = "verification"
	description = "Run MachineBench: Lua-as-wasm in Chicory vs Cobalt (snapshot/restore, memory cap, preemption, speed)"
	classpath = sourceSets.test.runtimeClasspath
	mainClass = "dev.virtualminecraft.computer.MachineBench"
	jvmArgs "-Xmx2G"
	if (project.hasProperty("benchJvmArgs")) {
		jvmArgs project.property("benchJvmArgs").split(" ").toList()
	}
	args = project.hasProperty("benchArgs") ? project.property("benchArgs").split(" ").toList() : []
}

loom {
	runs {
		server {
			runDir "run/server"
			// The QEMU D-Bus display link uses FFM (dbus/Libc); without this the JVM only warns, once.
			vmArg("--enable-native-access=ALL-UNNAMED")
		}
		client {
			// NVIDIA threaded optimizations fight with off-thread texture uploads.
			environmentVariable("__GL_THREADED_OPTIMIZATIONS", "0")
			vmArg("--enable-native-access=ALL-UNNAMED")
			if (System.getProperty("virtualminecraft.puppet") != null) {
				vmArg("-Dvirtualminecraft.puppet=" + System.getProperty("virtualminecraft.puppet"))
			}
			if (System.getProperty("virtualminecraft.debugOpenScreen") != null) {
				vmArg("-Dvirtualminecraft.debugOpenScreen=" + System.getProperty("virtualminecraft.debugOpenScreen"))
			}
		}
	}
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
